# SonarQube Cloud (ADR-023). El token va en el secreto SONAR_TOKEN del repositorio.
sonar.organization=jeromontoya19
sonar.projectKey=jeromontoya19_uco-kudos-frontend
sonar.projectName=uco-kudos-frontend

sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/pruebas/**
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
# main.tsx solo monta la app: no tiene lógica que probar.
sonar.coverage.exclusions=src/main.tsx,src/**/*.d.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# La CI espera el resultado del quality gate y falla si no pasa.
sonar.qualitygate.wait=true
